<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }


/* ================= 栏目 / 分类 / 标签 / 搜索 / 反馈 ================= */
function navName(id){
  const def={phrase:'词句积累',material:'素材积累',role:'角色记录'};
  const lbl=D.settings.navLabels||{};
  return lbl[id]||def[id]||id;
}
function editNavLabel(id){
  dlg(`<h3>重命名栏目</h3>
  <div class="field"><label>栏目名称</label><input type="text" id="nlName" value="${esc(navName(id))}"></div>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="doEditNavLabel('${id}')">保存</button></div>`);
}
function doEditNavLabel(id){
  const v=document.getElementById('nlName').value.trim(); if(!v) return toast('请输入名称');
  D.settings.navLabels=D.settings.navLabels||{}; D.settings.navLabels[id]=v; save(); closeDlg(); render();
}
function phraseCatList(){
  const set=[...(D.cats||CATS)];
  D.words.forEach(i=>{ if(i.cat && !set.includes(i.cat)) set.push(i.cat); });
  D.sentences.forEach(i=>{ if(i.cat && !set.includes(i.cat)) set.push(i.cat); });
  return set;
}
function phraseMatch(i,q){
  if(!q) return true;
  return (i.text&&i.text.indexOf(q)!==-1) || (i.cat&&i.cat.indexOf(q)!==-1) || (i.tag&&i.tag.indexOf(q)!==-1);
}
function phraseCatTags(cat){ return (D.phraseTags && D.phraseTags[cat])||[]; }
function renamePhraseCat(cat){
  dlg(`<h3>编辑分类</h3>
  <div class="field"><label>分类名称</label><input type="text" id="rcName" value="${esc(cat)}"></div>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="doRenamePhraseCat('${esc(cat)}')">保存</button></div>`);
}
function doRenamePhraseCat(old){
  const nv=document.getElementById('rcName').value.trim(); if(!nv) return toast('请输入名称');
  if(nv!==old && allCats().includes(nv)) return toast('该分类已存在');
  const idx=(D.cats||[]).indexOf(old);
  if(idx>=0) D.cats[idx]=nv;
  D.words.forEach(i=>{ if(i.cat===old) i.cat=nv; });
  D.sentences.forEach(i=>{ if(i.cat===old) i.cat=nv; });
  if(D.phraseTags && D.phraseTags[old]){ D.phraseTags[nv]=D.phraseTags[old]; delete D.phraseTags[old]; }
  save(); closeDlg(); render();
}
function delPhraseCat(cat){
  if(cat==='其他') return toast('「其他」是默认分类，不可删除');
  confirmDel(`删除分类「${esc(cat)}」？其中的内容会自动归入「其他」。`,()=>{
    D.words.forEach(i=>{ if(i.cat===cat) i.cat='其他'; });
    D.sentences.forEach(i=>{ if(i.cat===cat) i.cat='其他'; });
    D.cats=D.cats.filter(x=>x!==cat);
    if(D.phraseTags && D.phraseTags[cat]) delete D.phraseTags[cat];
    save(); render(); toast('已删除');
  });
}
function addPhraseTag(){
  const cat=route.filter;
  dlg(`<h3>新建标签</h3><div class="field"><label>标签名称</label><input type="text" id="ntIn" placeholder="如：女性外貌描写"></div>
   <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="doAddPhraseTag()">添加</button></div>`);
}
function doAddPhraseTag(){
  const v=document.getElementById('ntIn').value.trim(); if(!v) return toast('请输入标签');
  const cat=route.filter;
  D.phraseTags=D.phraseTags||{}; if(!D.phraseTags[cat]) D.phraseTags[cat]=[];
  if(D.phraseTags[cat].includes(v)) return toast('该标签已存在');
  D.phraseTags[cat].push(v); save(); closeDlg(); render();
}
function addAssignPhraseTag(tab,id){
  const cat=route.filter;
  const list=tab==='word'?D.words:D.sentences;
  const item=list.find(i=>i.id===id);
  const tags=phraseCatTags(cat);
  dlg(`<h3>设置标签</h3>
    <div class="field"><label>为这条内容选择或输入标签</label>
      <input type="text" id="tgIn" list="tgList" placeholder="如：女性外貌描写" value="${esc(item.tag||'')}">
      <datalist id="tgList">${tags.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
    </div>
    <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button>
    <button class="btn sm" onclick="doAssignPhraseTag('${tab}','${id}')">保存</button>
    ${item.tag?`<button class="btn sm ghost" onclick="doClearPhraseTag('${tab}','${id}')">清除标签</button>`:''}</div>`);
}
function doAssignPhraseTag(tab,id){
  const v=document.getElementById('tgIn').value.trim(); if(!v) return toast('请输入标签');
  const cat=route.filter;
  D.phraseTags=D.phraseTags||{}; if(!D.phraseTags[cat]) D.phraseTags[cat]=[];
  if(!D.phraseTags[cat].includes(v)) D.phraseTags[cat].push(v);
  const list=tab==='word'?D.words:D.sentences;
  const item=list.find(i=>i.id===id); item.tag=v;
  save(); closeDlg(); render();
}
function doClearPhraseTag(tab,id){
  const list=tab==='word'?D.words:D.sentences;
  const item=list.find(i=>i.id===id); item.tag='';
  save(); closeDlg(); render();
}
function setPhraseSearch(v){ route.q=v; render(); const inp=document.getElementById('phraseSearch'); if(inp){ inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} } }
function setMaterialSearch(v){ route.q=v; render(); const inp=document.getElementById('matSearch'); if(inp){ inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} } }
function materialMatch(m,s,n,q){
  return (m.name&&m.name.indexOf(q)!==-1) || (s.name&&s.name.indexOf(q)!==-1) || (n.title&&n.title.indexOf(q)!==-1) || (n.body&&n.body.indexOf(q)!==-1);
}

  h+=`<div class="fb-card">
    <div class="fb-head">💬 欢迎使用「${esc(navName('phrase'))}」语C工作台</div>
    <p class="fb-p">这是一款纯本地、可离线使用的语C写作工作台。你的所有数据都保存在本机浏览器中，不会上传任何服务器。</p>
    <div class="fb-block">
      <div class="fb-title">📢 公告</div>
      <p class="fb-p">· 支持左滑删除、长按多选批量操作、导出图片 / 文件。<br>· 基础栏目、分类、标签均可自定义，打造属于你的工作台。</p>
    </div>
    <div class="fb-block">
      <div class="fb-title">✉️ 联系开发者</div>
      <p class="fb-p">如果你在使用中遇到问题，或希望新增功能，欢迎随时联系：</p>
      <div class="fb-row"><span class="fb-k">QQ</span><a class="fb-v" href="https://w.qq.com/" onclick="copyText('3362853310','QQ已复制');return false;">3362853310</a><button class="btn sm ghost" onclick="copyText('3362853310','QQ已复制')">复制</button></div>

    <div class="fb-tip">提示：本程序完全免费，数据存在你自己的浏览器里，建议定期使用侧栏「备份导出」保存一份。</div>
  </div>`;
  return h;
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
function copyText(t,msg){ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>{ fallbackCopy(t); toast(msg); }); } else { fallbackCopy(t); toast(msg); } }

</script>

#app{display:flex;height:100%;}
/* 侧边栏 */
#sidebar{width:232px;min-width:232px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .25s ease;z-index:30}
#sidebar.hidden{margin-left:-232px}
.brand{padding:22px 20px 14px;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-family:serif;flex-shrink:0}
.brand .name{font-size:17px;font-weight:600;letter-spacing:2px}
.brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:1px}
#navList{flex:1;overflow-y:auto;padding:6px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink-soft);margin-bottom:2px;cursor:pointer;position:relative;user-select:none}
.nav-item:hover{background:var(--sky-mist)}
.nav-item.active{background:var(--sky-light);color:var(--sky-deep);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:15px}
.nav-item .del{margin-left:auto;color:var(--ink-faint);font-size:12px;opacity:0;padding:2px 5px;border-radius:6px}
.nav-item:hover .del{opacity:1}
.nav-item .del:hover{color:var(--danger);background:#FBEEEE}
.nav-sec{font-size:11px;color:var(--ink-faint);padding:14px 12px 6px;letter-spacing:1px}
.add-nav{margin:8px 12px 14px;padding:9px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-faint);text-align:center;font-size:13px}
.add-nav:hover{color:var(--sky-deep);border-color:var(--sky)}
/* 侧栏底部 同步区 */
#syncBox{border-top:1px solid var(--line);padding:12px 16px}
.sync-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(92,184,154,.5);animation:pulse 2s infinite}
.dot.off{background:#C4CFD9}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(92,184,154,.45)}70%{box-shadow:0 0 0 7px rgba(92,184,154,0)}100%{box-shadow:0 0 0 0 rgba(92,184,154,0)}}
.sync-btns{display:flex;gap:8px;margin-top:10px}
.sync-btns button{flex:1;padding:6px 0;font-size:12px;border:1px solid var(--line);border-radius:8px;color:var(--ink-soft);background:var(--sky-mist)}
.sync-btns button:hover{color:var(--sky-deep);border-color:var(--sky)}
#saveHint{font-size:11px;color:var(--ink-faint);margin-top:8px;text-align:center}

/* 主区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:54px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-shrink:0}
#menuBtn{width:34px;height:34px;border-radius:9px;color:var(--ink-soft);font-size:17px}
#menuBtn:hover{background:var(--sky-light);color:var(--sky-deep)}
#pageTitle{font-size:16px;font-weight:600;letter-spacing:.5px}
#topStatus{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);background:var(--sky-mist);border:1px solid var(--line);padding:5px 12px;border-radius:20px}
#content{flex:1;overflow-y:auto;padding:22px;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:20px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);font-size:14px}
.tab.active{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{padding:5px 14px;border-radius:16px;font-size:13px;background:var(--sky-mist);border:1px solid var(--line);color:var(--ink-soft)}
.chip.active{background:var(--sky-light);border-color:var(--sky);color:var(--sky-deep);font-weight:600}
.chip b{font-weight:600;margin-left:4px;font-size:12px}
.input-row{display:flex;gap:10px}
.input-row textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:none;background:var(--sky-mist);line-height:1.7;min-height:52px;transition:border .2s}
.input-row textarea:focus{border-color:var(--sky);background:#fff}
.btn{padding:0 22px;border-radius:12px;background:var(--sky);color:#fff;font-weight:600;flex-shrink:0;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--sky-mist);color:var(--sky-deep);border:1px solid var(--line)}
.btn.sm{padding:7px 16px;border-radius:9px;font-size:13px}
.item-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;animation:fadein .25s;transition:box-shadow .15s,border-color .15s}
.item-card:hover{box-shadow:0 4px 14px rgba(120,150,170,.14);border-color:var(--sky)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.item-card .txt{flex:1;line-height:1.75;word-break:break-all;white-space:pre-wrap}
.item-card .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
.badge{font-size:11.5px;padding:3px 10px;border-radius:12px;background:var(--sky-light);color:var(--sky-deep);border:none;cursor:pointer}
.time{font-size:11px;color:var(--ink-faint)}
.icon-btn{color:var(--ink-faint);font-size:13px;padding:3px 6px;border-radius:6px}
.icon-btn:hover{color:var(--danger);background:#FBEEEE}
.empty{text-align:center;color:var(--ink-faint);padding:46px 0;font-size:13.5px;line-height:2}
.empty .big{font-size:30px;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.folder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s}
.folder:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(77,168,218,.14);border-color:var(--sky)}
.folder .f-ico{font-size:24px;margin-bottom:10px}
.folder .f-name{font-weight:600;font-size:15px}
.folder .f-count{font-size:12px;color:var(--ink-faint);margin-top:4px}
.folder .del{position:absolute;top:10px;right:10px;opacity:0}
.folder:hover .del{opacity:1}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-faint);margin-bottom:16px;flex-wrap:wrap}
.crumb a{color:var(--sky-deep);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.note-title{width:100%;border:none;font-size:16px;font-weight:600;margin-bottom:8px;background:transparent}
.note-body{width:100%;border:none;background:transparent;resize:none;line-height:1.9;min-height:120px;font-size:14.5px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.section-h h3{font-size:15px;font-weight:600;letter-spacing:.5px}
.hint{font-size:12px;color:var(--ink-faint);line-height:1.8}
.tag{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:10px;background:var(--sky-light);color:var(--sky-deep);margin:2px 4px 2px 0}
.tag .x{margin-left:4px;cursor:pointer;opacity:.6}
.tag .x:hover{opacity:1;color:var(--danger)}
/* 时间线 */
.tl-group{margin-bottom:22px}
.tl-era{font-size:13px;font-weight:600;color:var(--sky-deep);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tl-era::after{content:"";flex:1;height:1px;background:var(--line)}
.tl-item{display:flex;gap:14px;padding:0 0 18px 0;position:relative}
.tl-item::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1.5px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--sky);margin-top:4px;flex-shrink:0;z-index:1}
.tl-body{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.tl-date{font-size:13px;font-weight:600;color:var(--sky-deep)}
.tl-people{font-size:12px;color:var(--ink-soft);margin:4px 0}
.tl-event{line-height:1.7;font-size:14px}
/* 关系 */
.rel-center{text-align:center;margin-bottom:20px}
.rel-center .core{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:74px;padding:0 14px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;font-weight:600;font-size:16px;box-shadow:0 6px 16px rgba(77,168,218,.35)}
.rel-card{display:flex;gap:12px;align-items:flex-start}
.rel-avatar{width:42px;height:42px;border-radius:50%;background:var(--sky-light);color:var(--sky-deep);display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;font-size:15px}
/* 弹窗 */
#mask{position:fixed;inset:0;background:rgba(44,62,80,.35);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
#mask.show{display:flex}
#dialog{background:var(--card);border-radius:18px;padding:24px;width:min(430px,90vw);max-height:84vh;overflow-y:auto;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
#dialog h3{font-size:16px;margin-bottom:16px}
#dialog .field{margin-bottom:14px}
#dialog label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
#dialog input[type=text],#dialog textarea,#dialog select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sky-mist)}
#dialog input:focus,#dialog textarea:focus{border-color:var(--sky);background:#fff}
#dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#dialog.wide{width:min(640px,94vw)}
/* OCR */
.ocr-zone{border:1.5px dashed var(--line);border-radius:12px;padding:13px;text-align:center;color:var(--ink-soft);font-size:13px;margin-top:12px;cursor:pointer;background:var(--sky-mist);transition:all .2s;line-height:1.7}
.ocr-zone:hover,.ocr-zone.drag{border-color:var(--sky);color:var(--sky-deep);background:var(--sky-light)}
.ocr-status{font-size:12.5px;color:var(--sky-deep);margin-top:10px;text-align:center}
.ocr-row{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ocr-row textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--sky-mist);line-height:1.6;resize:none;min-height:34px}
.ocr-row textarea:focus{border-color:var(--sky);background:#fff}
.ocr-row select{border:1px solid var(--line);border-radius:8px;padding:6px 4px;background:#fff;font-size:12.5px;color:var(--ink)}
.prog{height:5px;background:var(--sky-light);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--sky);width:0;transition:width .25s}
/* toast */
#toast{position:fixed;top:66px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);color:var(--card);padding:9px 20px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
#toast.show{opacity:.94;transform:translateX(-50%)}
/* ===== 古风韵味 ===== */
.brand .name,#pageTitle,.tab,.f-name,.section-h h3,#dialog h3,.tl-era,.rel-center .core,.empty,.nav-item,.nav-sec,.note-title,.crumb{font-family:var(--kai)}
.brand .name{font-size:19px;letter-spacing:4px}
.brand .sub{font-family:var(--kai);letter-spacing:3px}
#pageTitle{font-size:17px;letter-spacing:2px}
#pageTitle::before{content:"❖";color:var(--sky);font-size:11px;margin-right:8px;vertical-align:2px}
.tab{letter-spacing:1px}
.empty{letter-spacing:1.5px;font-size:14px}
.section-h h3::before{content:"❖ ";color:var(--sky);font-size:11px}
.tl-era::before{content:"✦ ";font-size:10px;opacity:.7}
#content{background:
  radial-gradient(900px 380px at 92% -8%, var(--sky-light) 0%, transparent 60%),
  radial-gradient(700px 320px at -8% 108%, var(--sky-light) 0%, transparent 55%)}
.card{border-top:2px solid var(--sky-light)}
.folder{border-top:2px solid var(--sky-light)}
.brand{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:4px}
/* 可更换图标 */
.brand .logo{cursor:pointer;overflow:hidden;font-family:var(--kai)}
.brand .logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.brand .logo:hover{opacity:.85}
.nav-item .ico{cursor:pointer;border-radius:6px}
.nav-item .ico:hover{background:var(--sky-light)}
.nav-item .ico img{width:20px;height:20px;border-radius:6px;object-fit:cover;vertical-align:-5px}
/* 颜色设置 */
.sw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border:1.5px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .15s}
.sw:hover{transform:translateY(-2px)}
.sw.cur{border-color:var(--sky);background:var(--sky-light);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.sw .c{width:36px;height:36px;border-radius:50%;margin:0 auto 9px;border:1px solid rgba(0,0,0,.1)}
.sw .n{font-size:13px;font-family:var(--kai);letter-spacing:1px}
/* 角色头像 / 关系头像 */
.char-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;overflow:hidden;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.char-ava.lg{width:64px;height:64px;font-size:24px}
.char-ava img,.rel-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rel-avatar{cursor:pointer;overflow:hidden}
.char-head{display:flex;align-items:center;gap:14px;padding:2px 2px 14px}
.char-name{font-size:18px;font-weight:600;letter-spacing:1px;font-family:var(--kai)}
/* 悬浮收录按钮 */
.fab{position:fixed;right:26px;bottom:26px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(60,90,110,.28);z-index:50;transition:transform .15s;font-family:var(--kai)}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.95)}
@media (max-width:768px){ .fab{right:18px;bottom:18px;width:50px;height:50px} }
/* 侧边栏 ID / 签名 */
.brand .name,.brand .sub{cursor:pointer}
.brand .name:hover,.brand .sub:hover{color:var(--sky-deep)}
/* 角色模块列表 */
.module-list{display:flex;flex-direction:column;gap:10px}
.module-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;align-items:center;justify-content:space-between}
.module-card:hover{box-shadow:0 4px 14px rgba(120,150,170,.14);border-color:var(--sky)}
.module-card.add{justify-content:center;color:var(--ink-faint);border-style:dashed;background:transparent}
.module-card .module-name{font-size:15px;font-weight:600;font-family:var(--kai);letter-spacing:1px}
.module-card .module-hint{font-size:12px;color:var(--ink-faint)}
.module-hint{font-size:12px;color:var(--ink-faint);font-weight:400}
/* 词句分类纵向列表 */
.cat-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cat-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.cat-row:hover{box-shadow:0 4px 14px rgba(120,150,170,.14);border-color:var(--sky)}
.cat-name{font-size:15px;font-family:var(--kai);letter-spacing:1px}
.cat-count{font-size:12px;color:var(--ink-faint);background:var(--sky-mist);padding:2px 10px;border-radius:10px}
/* 戏录存档 */
.archive-list{display:flex;flex-direction:column;gap:10px}
.archive-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.archive-item:hover{box-shadow:0 4px 14px rgba(120,150,170,.14);border-color:var(--sky)}
.archive-item .ai-ico{font-size:20px}
.archive-item .ai-title{flex:1;font-size:15px;font-family:var(--kai);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.archive-item .ai-count{font-size:12px;color:var(--ink-faint);background:var(--sky-mist);padding:2px 10px;border-radius:10px}
.archive-item .ai-date{font-size:11px;color:var(--ink-faint)}
.archive-body{line-height:1.9;white-space:pre-wrap;word-break:break-all}
/* 字体工具条 */
.font-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:10px;background:var(--sky-mist);border-radius:10px}
.font-bar select,.font-bar input[type=color]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-size:13px}
/* 全屏编辑器（人设 / 戏录 / 素材） */
.editor-layer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:transparent}
.editor-layer.hidden{display:none}
.editor-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;background-color:var(--sky-mist)}
.editor-top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bar);border-bottom:1px solid var(--line);flex-shrink:0}
.editor-top .t-title{font-size:15px;font-weight:600;font-family:var(--kai);letter-spacing:1px;margin-right:auto}
.editor-bar{position:relative;z-index:3;display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.editor-bar.show{display:flex}
.editor-bar label{font-size:12px;color:var(--ink-soft)}
.editor-bar select,.editor-bar input[type=color]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-size:13px}
.bg-pos{display:flex;align-items:center;gap:8px}
.pos-grid{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.pos-btn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;color:var(--ink);cursor:pointer}
.pos-btn.active{background:var(--sky);color:#fff;border-color:var(--sky-deep)}
.editor-content{position:relative;z-index:2;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:34px 22px 96px;display:flex;flex-direction:column}
.editor-title{width:100%;border:none;background:transparent;font-size:24px;font-weight:700;font-family:var(--kai);color:var(--ink);margin-bottom:18px;outline:none;text-shadow:0 1px 3px rgba(255,255,255,.65)}
.editor-body{width:100%;border:none;background:transparent;resize:none;outline:none;line-height:1.95;min-height:62vh;font-size:16px;color:var(--ink);text-shadow:0 1px 3px rgba(255,255,255,.65)}
.editor-tap{position:relative;z-index:2;font-size:12px;color:var(--ink-faint);text-align:center;margin-top:8px}
/* 列表图标替代 emoji */
.ai-ico{width:22px;height:22px;border-radius:50%;background:var(--sky-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-ico::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sky)}
.ai-ico.folder::before{width:10px;height:8px;border-radius:2px;background:transparent;border:2px solid var(--sky)}
/* 移动端 */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25;display:none}
@media (max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;margin-left:-232px}
  #sidebar.open{margin-left:0}
  #dim.show{display:block}
  #content{padding:14px}
  #topStatus .st-txt{display:none}
}
/* 左滑删除 */
.swipe{position:relative;overflow:hidden;margin-bottom:10px;background:var(--card);border-radius:var(--radius);isolation:isolate}
.swipe-del{position:absolute;right:0;top:var(--radius);bottom:var(--radius);width:76px;display:flex;align-items:center;justify-content:center;background:var(--danger);z-index:0;border-radius:0}
.swipe-del-btn{color:#fff;font-size:13px;font-weight:600;background:transparent;border:none;padding:0}
.swipe-fore{position:relative;z-index:1;background:var(--card);transition:transform .2s;touch-action:pan-y}
.swipe-fore > *{margin-bottom:0}
.archive-list .swipe{margin-bottom:0}
.grid .swipe{margin-bottom:0}
/* 多选工具条 */
#selBar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:none;align-items:center;justify-content:space-between;z-index:90;gap:12px}
#selBar.show{display:flex}
.sel-info{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.sel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sel-cb{width:18px;height:18px;margin-right:10px;flex-shrink:0;cursor:pointer;accent-color:var(--sky-deep)}

/* 搜索框 */
.search-bar{position:relative;margin-bottom:14px}
.search-bar input{width:100%;box-sizing:border-box;padding:10px 38px 10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--ink);outline:none}
.search-bar input:focus{border-color:var(--sky)}
.search-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none}
/* 标签筛选条 */
.tag-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tag-chip{font-size:12.5px;padding:4px 12px;border-radius:12px;background:var(--sky-mist);color:var(--sky-deep);cursor:pointer;border:1px solid transparent}
.tag-chip.on{background:var(--sky);color:#fff}
.tag-add{font-size:12.5px;padding:4px 10px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-faint);cursor:pointer}
/* 分类编辑符号 */
.cat-edit,.cat-del{font-size:13px;cursor:pointer;opacity:.55;user-select:none}
.cat-edit:hover,.cat-del:hover{opacity:1}
.cat-edit:hover{color:var(--sky-deep)}
.cat-del:hover{color:var(--danger)}
/* 侧栏可重命名 */
.nav-label{cursor:pointer}
.nav-edit{margin-left:auto;font-size:12px;opacity:.45;cursor:pointer}
.nav-item:hover .nav-edit{opacity:.85}
.nav-edit:hover{color:var(--sky-deep)}
/* 反馈页 */
.nav-feedback{margin:10px 12px 16px;padding:10px;border-radius:10px;color:var(--ink-soft);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.nav-feedback:hover{background:var(--sky-mist);color:var(--sky-deep)}
.fb-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;line-height:1.9}
.fb-head{font-size:16px;font-weight:600;color:var(--sky-deep);margin-bottom:10px;font-family:var(--kai)}
.fb-p{font-size:14px;color:var(--ink-soft);margin:6px 0}
.fb-block{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.fb-title{font-size:14px;font-weight:600;margin-bottom:6px}
.fb-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.fb-k{width:42px;color:var(--ink-faint);font-size:13px}
.fb-v{color:var(--sky-deep);text-decoration:none;font-weight:600}
.fb-tip{margin-top:16px;font-size:12.5px;color:var(--ink-faint);background:var(--sky-mist);padding:10px 12px;border-radius:10px}
.ai-path{margin-left:auto;font-size:12px;color:var(--ink-faint);max-width:50%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo" id="brandLogo" onclick="editLogo()" title="点击更换图标">无</div>
      <div>
        <div class="name" id="brandName" onclick="editBrandText()" title="点击修改 ID">无明</div>
        <div class="sub" id="brandSub" onclick="editBrandText()" title="点击修改签名">无无明，亦无无明尽</div>
      </div>
    </div>
    <nav id="navList"></nav>
    <div class="add-nav" onclick="addNavItem()">＋ 添加栏目</div>

    <div class="add-nav" style="margin-top:-8px" onclick="openFontManager()">字体管理</div>
    <div id="syncBox">
      <div class="sync-line"><span class="dot off" id="syncDot"></span><span id="syncTxt">检测中…</span></div>
      <div class="sync-btns">
        <button onclick="exportData()">备份导出</button>
        <button onclick="importData()">导入恢复</button>
        <button onclick="resetWorkbench()">重置空白</button>
      </div>
      <div id="saveHint">数据已自动保存在本机</div>
    </div>
    <div class="nav-feedback" onclick="go('feedback')">💬 反馈 / 公告</div>
  </aside>
  <div id="dim" onclick="toggleSidebar(false)"></div>
  <div id="main">
    <header id="topbar">
      <button id="menuBtn" onclick="toggleSidebar()">☰</button>
      <div id="pageTitle">词句积累</div>
      <div id="topStatus"><span class="dot off" id="topDot"></span><span class="st-txt" id="topTxt">未连接</span></div>
    </header>
    <div id="content"><div class="wrap" id="page"></div></div>
  </div>
</div>

const DB_KEY = 'wuming_data_v1';
const defaultData = () => ({
  settings: { theme:'qingshan', logoText:'无', logoImg:DEFAULT_LOGO_IMG, navIcons:{}, userId:'无明', signature:'无无明，亦无无明尽', customFonts:[], navLabels:{} },
  cats: ['外貌描写','神态描写','动作描写','语言描写','心理描写','场景描写','其他'],
  phraseTags: {},           // 分类下用户自定义标签 {cat:[tag,...]}
  phraseCats: [],           // 兼容旧字段
  customNavs: [],           // {id,name,icon,items:[{id,type:'folder'|'entry',title,body,parentId,style,bg,bgPos,ts}]}
  words: [],                // 词汇 {id,text,cat,ts}
  sentences: [],            // 句段 {id,text,cat,ts}
  materials: [              // 素材 {id,name,icon,subs:[{id,name,notes:[{id,title,body,ts,style:{fontFamily,fontSize,color,fontWeight},bg,bgPos}]}]}
    {id:'m1', name:'戏梗', icon:'', subs:[]},
    {id:'m2', name:'历史', icon:'', subs:[]}
  ],
  characters: []            // {id,name,avatar,persona,personaStyle:{fontFamily,fontSize,color,fontWeight},personaBg,personaBgPos,timeline:[...],relations:[...],archive:{items:[{id,type,title,body,parentId,style,bg,bgPos,ts}]},modules:[...]}
});
let D = load();
let SEL = null;
let _selLock = false;
function load(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw){ const d = JSON.parse(raw);
    const base = defaultData();
    const merged = Object.assign(base, d);
    merged.settings = Object.assign({theme:'qingshan',logoText:'无',logoImg:'',navIcons:{},userId:'无明',signature:'无无明，亦无无明尽',customFonts:[]}, d.settings||{});
    if(merged.settings.userId==='无名') merged.settings.userId='无明';
    if(merged.settings.signature==='语C工作台') merged.settings.signature='无无明，亦无无明尽';
    if(!merged.settings.logoImg) merged.settings.logoImg=DEFAULT_LOGO_IMG;
    if(!merged.phraseCats) merged.phraseCats=[];
    if(!merged.cats) merged.cats = CATS.slice();
    if(merged.phraseCats && merged.phraseCats.length) merged.cats = merged.cats.concat(merged.phraseCats.filter(c=>!merged.cats.includes(c)));
    if(!merged.phraseTags) merged.phraseTags = {};
    if(!merged.settings.navLabels) merged.settings.navLabels={};
    (merged.materials||[]).forEach(m=>{
      m.subs.forEach(s=>{
        s.notes.forEach(n=>{ if(!n.style) n.style={}; if(n.bg===undefined) n.bg=''; if(n.bgPos===undefined) n.bgPos='center'; });
      });
    });
    (merged.customNavs||[]).forEach(n=>{
      if(!n.items) n.items=[];
      if(typeof n.content==='string' && n.content){ n.items.push({id:uid(),type:'entry',title:n.name||'素材',body:n.content,parentId:null,style:{},bg:'',bgPos:'center',ts:Date.now()}); n.content=''; }
      n.items.forEach(it=>{ if(!it.style) it.style={}; if(it.bg===undefined) it.bg=''; if(it.bgPos===undefined) it.bgPos='center'; });
    });
    (merged.characters||[]).forEach(ch=>{
      if(typeof ch.archive==='string') ch.archive={items:[{id:uid(),type:'entry',title:'旧存档',body:ch.archive||'',parentId:null,style:{},bg:'',bgPos:'center',ts:Date.now()}]};
      else if(!ch.archive || !ch.archive.items) ch.archive={items:[]};
      if(!ch.modules) ch.modules=[];
      ch.modules.forEach(m=>{
        if(!m.items) m.items=[];
        if(typeof m.content==='string' && m.content){ m.items.push({id:uid(),type:'entry',title:m.name||'素材',body:m.content,parentId:null,style:{},bg:'',bgPos:'center',ts:Date.now()}); m.content=''; }
        m.items.forEach(it=>{ if(!it.style) it.style={}; if(it.bg===undefined) it.bg=''; if(it.bgPos===undefined) it.bgPos='center'; });
      });
      if(!ch.personaStyle) ch.personaStyle={};
      if(ch.personaBg===undefined) ch.personaBg='';
      if(ch.personaBgPos===undefined) ch.personaBgPos='center';
      (ch.archive.items||[]).forEach(it=>{ if(!it.style) it.style={}; if(it.bg===undefined) it.bg=''; if(it.bgPos===undefined) it.bgPos='center'; });
    });
    return merged; } }catch(e){}
  return defaultData();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem(DB_KEY, JSON.stringify(D));
    const t=new Date();
    document.getElementById('saveHint').textContent='已自动保存 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
  },300);
}
window.addEventListener('beforeunload',()=>{ localStorage.setItem(DB_KEY, JSON.stringify(D)); });
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtTs = ts => { const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

/* ================= 云端连接状态 ================= */
function updateOnline(){
  const on = navigator.onLine;
  document.getElementById('syncDot').className = 'dot '+(on?'on':'off');
  document.getElementById('topDot').className = 'dot '+(on?'on':'off');
  document.getElementById('syncTxt').textContent = on ? '云端已连接 · 可同步' : '未连接 · 仅本地保存';
  document.getElementById('topTxt').textContent = on ? '云端已连接' : '未连接';
  document.getElementById('topStatus').style.borderColor = on ? '#BFE3D5' : 'var(--line)';
}
window.addEventListener('online',updateOnline);
window.addEventListener('offline',updateOnline);

/* ================= 备份 / 同步 ================= */
function exportData(){
  const blob = new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a = document.createElement('a');

function classify(text){
  let best='其他', bestScore=0;
  for(const cat of CATS){
    if(cat==='其他') continue;
    let s=0;
    for(const k of KW[cat]){
      let idx=0;
      while((idx=text.indexOf(k,idx))!==-1){ s+=k.length>1?2:1; idx+=k.length; }
    }
    if(s>bestScore){ bestScore=s; best=cat; }
  }
  return best;
}
function allCats(){ return D.cats||CATS; }

/* ================= 中文日期解析（时间线） ================= */
const CN_NUM = {'零':0,'〇':0,'一':1,'元':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'正':1,'冬':11,'腊':12,'初':0,'廿':20,'卅':30};
function cn2n(s){
  if(!s) return 0;
  s = s.trim();
  if(/^\d+$/.test(s)) return parseInt(s);
  let n=0, tmp=0;
  for(const ch of s){
    if(ch==='十'){ tmp = tmp===0 ? 10 : tmp*10; }
    else if(ch==='百'){ tmp = (tmp===0?1:tmp)*100; n+=tmp; tmp=0; }
    else if(CN_NUM[ch]!==undefined){
      if(ch==='廿'){ tmp+=20; } else if(ch==='卅'){ tmp+=30; }
      else if(tmp>=10){ n+=tmp; tmp=CN_NUM[ch]; if(tmp<10&&tmp>0){n+=tmp;tmp=0;} else {n+=tmp;tmp=0;} }
      else tmp+=CN_NUM[ch];
    }
  }
  return n+tmp;
}
function parseCnDate(str){
  str = (str||'').trim();
  const re = /^(.*?)([元一二两三四五六七八九十百零〇\d]+)\s*年(?:\s*([正冬腊一二两三四五六七八九十\d]+)\s*月)?(?:\s*([初廿卅一二两三四五六七八九十\d]+)\s*[日号]?)?/;
  const m = str.match(re);
  if(m){
    return { era:(m[1]||'').trim()||'未纪年', y:cn2n(m[2]), m:m[3]?cn2n(m[3]):0, d:m[4]?cn2n(m[4]):0, ok:true };
  }
  return { era:'未注明日期', y:0, m:0, d:0, ok:false };
}

let pendingIcon=null;

function fileToIcon(file,size,cb){
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=size; c.height=size;
    const ctx=c.getContext('2d'); const r=Math.max(size/img.width,size/img.height);
    const w=img.width*r,h=img.height*r; ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
    cb(c.toDataURL('image/png')); URL.revokeObjectURL(url); };
  img.onerror=()=>{ toast('图片读取失败'); URL.revokeObjectURL(url); };
  img.src=url;
}

  setTimeout(()=>{const f=document.querySelector('#dialog input,#dialog textarea'); f&&f.focus();},60); }
function closeDlg(){ document.getElementById('mask').classList.remove('show'); document.getElementById('dialog').classList.remove('wide'); }
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeDlg(); });
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function confirmDel(msg, fn){
  dlg(`<h3>确认删除</h3><p class="hint" style="font-size:13.5px">${esc(msg)}</p>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button>
  <button class="btn sm" style="background:var(--danger)" id="cfBtn">删除</button></div>`);
  document.getElementById('cfBtn').onclick=()=>{ fn(); closeDlg(); };
}

/* ================= 侧边栏 ================= */
function renderNav(){
  const el=document.getElementById('navList');
  let h = `<div class="nav-sec">基础栏目</div>`;
  for(const n of BASE_NAVS){
    h+=`<div class="nav-item ${route.page===n.id?'active':''}" onclick="go('${n.id}')">
      ${navIcoHtml(n.id,n.icon)}<span class="nav-label">${esc(navName(n.id))}</span>
      <span class="nav-edit" onclick="event.stopPropagation();editNavLabel('${n.id}')" title="重命名栏目">✎</span></div>`;
  }
  if(D.customNavs.length){
    h+=`<div class="nav-sec">我的栏目</div>`;
    for(const n of D.customNavs){
      h+=`<div class="nav-item ${route.page==='custom'&&route.sub===n.id?'active':''}" data-swkind="nav" data-swa="${n.id}" onclick="go('custom',{sub:'${n.id}'})">
        ${selCb('nav', n.id)}${navIcoHtml(n.id,n.icon||'📌')}${esc(n.name)}
        <span class="del" onclick="event.stopPropagation();delNav('${n.id}')">✕</span></div>`;
    }
  }
  el.innerHTML=h;
}
function addNavItem(){
  dlg(`<h3>添加栏目</h3>
  <div class="field"><label>栏目名称</label><input type="text" id="nvName" placeholder="如：灵感随记"></div>
  <div class="field"><label>图标（可选，一个emoji）</label><input type="text" id="nvIco" placeholder="📌"></div>
  <div class="acts" style="margin-top:12px">
    <button class="btn sm ghost" onclick="closeDlg()">取消</button>
    <button class="btn sm" onclick="doAddNav('folder')">＋ 新建文件夹</button>
    <button class="btn sm" onclick="doAddNav('note')">＋ 新建素材</button>
  </div>`);
}
function doAddNav(type){
  const name=document.getElementById('nvName').value.trim();
  if(!name) return toast('请输入栏目名称');
  const icon=document.getElementById('nvIco').value.trim()||'📌';
  const id=uid();
  const nav={id,name,icon,items:[]};
  D.customNavs.push(nav); save(); closeDlg();
  go('custom',{sub:id});
  if(type==='note') nbEdit(null);
}
function delNav(id){
  const n=D.customNavs.find(x=>x.id===id);
  confirmDel(`删除栏目「${n.name}」？其中的内容也会一并删除。`,()=>{
    D.customNavs=D.customNavs.filter(x=>x.id!==id); save();
    if(route.page==='custom'&&route.sub===id) go('phrase'); else render();
  });
}

/* ================= 页面：词句积累 ================= */
function pagePhrase(){
  const tab = route.tab||'word';
  const list = tab==='word'?D.words:D.sentences;
  const tabName = tab==='word'?'词汇积累':'句段积累';
  const cats = phraseCatList();
  const q = route.q||'';
  const tpl_tabs = `<div class="tabs">
      <button class="tab ${tab==='word'?'active':''}" onclick="go('phrase',{tab:'word'})">词汇积累</button>
      <button class="tab ${tab==='sent'?'active':''}" onclick="go('phrase',{tab:'sent'})">句段积累</button>
    </div>`;
  const searchBar = `<div class="search-bar"><input id="phraseSearch" type="text" placeholder="搜索${tabName}：标签 / 分类 / 内容…" value="${esc(q)}" oninput="setPhraseSearch(this.value)"><span class="search-ico">🔍</span></div>`;
  if(route.filter){
    const cat = route.filter;
    const tags = phraseCatTags(cat);
    let shown = list.filter(i=>i.cat===cat && phraseMatch(i,q));
    if(route.tag) shown = shown.filter(i=>i.tag===route.tag);
    let h = tpl_tabs + searchBar;
    h += `<div class="crumb"><a onclick="go('phrase',{tab:'${tab}'})">${tabName}</a><span>›</span><span>${esc(cat)}</span></div>`;
    h += `<div class="tag-bar">`;
    h += `<span class="tag-chip ${!route.tag?'on':''}" onclick="go('phrase',{tab:'${tab}',filter:'${esc(cat)}',tag:null})">全部</span>`;
    for(const t of tags){
      h += `<span class="tag-chip ${route.tag===t?'on':''}" onclick="go('phrase',{tab:'${tab}',filter:'${esc(cat)}',tag:'${esc(t)}'})">${esc(t)}</span>`;
    }
    h += `<span class="tag-add" onclick="addPhraseTag()" title="新建标签">＋标签</span>`;
    h += `</div>`;
    h += `<div class="section-h"><h3>${esc(cat)}</h3><span class="module-hint">${shown.length} 条</span></div>`;
    if(!shown.length){
      h += `<div class="empty"><div class="big" style="font-family:var(--kai)">〇</div>「${esc(cat)}」一栏尚且空白<br>轻点右下角 ＋ 收录内容吧</div>`;
    } else {
      h += [...shown].reverse().map(i=>`
      <div class="item-card" data-swkind="phrase" data-swa="${tab}" data-swb="${i.id}">
        ${selCb('phrase', i.id)}
        <div class="txt">${esc(i.text)}</div>
        <div class="meta">
          <button class="badge" onclick="editCat('${tab}','${i.id}')" title="点击修改分类">${i.cat} ▾</button>
          ${i.tag?`<span class="tag" style="cursor:pointer" onclick="event.stopPropagation();go('phrase',{tab:'${tab}',filter:'${esc(cat)}',tag:'${esc(i.tag)}'})">${esc(i.tag)}</span>`:''}
          <button class="icon-btn" onclick="event.stopPropagation();addAssignPhraseTag('${tab}','${i.id}')" title="设置标签">标</button>
          <span class="time">${fmtTs(i.ts)}</span>
          <button class="icon-btn" onclick="delPhrase('${tab}','${i.id}')">删除</button>
        </div>
      </div>`).join('');
    }
    h += `<button class="fab" onclick="openPhraseInput()" title="收录">＋</button>`;
    return h;
  }
  if(q){
    const hits = list.filter(i=>phraseMatch(i,q));
    let h = tpl_tabs + searchBar;
    h += `<div class="section-h"><h3>搜索「${esc(q)}」</h3><span class="module-hint">${hits.length} 条结果</span></div>`;
    if(!hits.length) h += `<div class="empty"><div class="big" style="font-family:var(--kai)">〇</div>没有匹配的内容</div>`;
    else h += [...hits].reverse().map(i=>`
      <div class="item-card" data-swkind="phrase" data-swa="${tab}" data-swb="${i.id}" onclick="go('phrase',{tab:'${tab}',filter:'${esc(i.cat)}'})">
        ${selCb('phrase', i.id)}
        <div class="txt">${esc(i.text)}</div>
        <div class="meta">
          <span class="badge">${esc(i.cat)}</span>
          ${i.tag?`<span class="tag">${esc(i.tag)}</span>`:''}
          <span class="time">${fmtTs(i.ts)}</span>
        </div>
      </div>`).join('');
    h += `<button class="fab" onclick="openPhraseInput()" title="收录">＋</button>`;
    return h;
  }
  const counts={}; cats.forEach(c=>counts[c]=0); list.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  let h = tpl_tabs + searchBar;
  h += `<div class="section-h"><h3>${tabName}</h3><button class="btn sm" onclick="addPhraseCat()">＋ 添加分类</button></div>
    <div class="cat-list">`;
  for(const c of cats){
    h += `<div class="cat-row" onclick="go('phrase',{tab:'${tab}',filter:'${esc(c)}'})">
      <span class="cat-name">${esc(c)}</span>
      <span style="display:flex;align-items:center;gap:10px">
        <span class="cat-edit" onclick="event.stopPropagation();renamePhraseCat(this.getAttribute('data-cat'))" data-cat="${esc(c)}" title="重命名 / 编辑">✎</span>
        ${c!=='其他'?`<span class="cat-del" onclick="event.stopPropagation();delPhraseCat('${esc(c)}')" title="删除分类">🗑</span>`:''}
        <span class="cat-count">${counts[c]||0}</span><span style="color:var(--ink-faint)">›</span>
      </span>
    </div>`;
  }
  h += `</div><button class="fab" onclick="openPhraseInput()" title="收录">＋</button>`;
  return h;
}

function addPhraseCat(){
  dlg(`<h3>添加自定义分类</h3>
  <div class="field"><label>分类名称</label><input type="text" id="pcName" placeholder="如：服饰描写"></div>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="doAddPhraseCat()">添加</button></div>`);
}
function doAddPhraseCat(){
  const name=document.getElementById('pcName').value.trim(); if(!name) return toast('请输入分类名称');
  if(!D.cats) D.cats=CATS.slice();
  if(allCats().includes(name)) return toast('该分类已存在');
  D.cats.push(name); save(); closeDlg(); render();
  toast('分类已添加');
}
function openPhraseInput(){
  const tab=route.tab||'word';
  dlg(`<h3>收录${tab==='word'?'词汇':'句段'}</h3>
  <div class="field"><textarea id="phIn" rows="4" placeholder="${tab==='word'?'输入词汇或短句，自动归类…':'输入句子或段落，自动归类保存…'}"></textarea></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="icon-btn" style="color:var(--sky-deep)" onclick="closeDlg();document.getElementById('imgIn').click()">📷 识别图片</button>
    <div style="margin-left:auto" class="acts">
      <button class="btn sm ghost" onclick="closeDlg()">取消</button>
      <button class="btn sm" onclick="addPhrase();closeDlg()">收录</button>
    </div>
  </div>
  <div class="hint" style="margin-top:8px">归类不准时，收录后点词条上的类别标签即可修改。</div>`);
  setTimeout(()=>{const t=document.getElementById('phIn'); t&&t.focus();},60);
}
function addPhrase(){
  const el=document.getElementById('phIn');
  if(!el) return;
  const tab=route.tab||'word';
  // 一次可录入多条：按换行拆分；词汇模式或较短内容再按顿号/逗号/分号拆成独立词条
  const lines=el.value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
  const items=[];
  lines.forEach(line=>{
    if(tab==='word' || line.length<=20){
      line.split(/[、，；;,]/).map(x=>x.trim()).filter(Boolean).forEach(p=>items.push(p));
    } else {
      items.push(line);
    }
  });
  const seen=new Set(); let added=0;
  items.forEach(text=>{
    if(!text || seen.has(text)) return; seen.add(text);
    const cat=classify(text);
    (tab==='word'?D.words:D.sentences).push({id:uid(),text,cat,tag:'',ts:Date.now()});
    added++;
  });
  if(!added){ toast('没有可收录的内容'); return; }
  save(); render();
  const open=document.getElementById('mask').classList.contains('show');
  if(open){ el.value=''; setTimeout(()=>el.focus(),0); }
  toast(`已收录 ${added} 条，已分别归入对应分类`);
}
function delPhrase(tab,id){
  confirmDel('删除这条内容？',()=>{
    if(tab==='word') D.words=D.words.filter(i=>i.id!==id);
    else D.sentences=D.sentences.filter(i=>i.id!==id);
    save(); render();
  });
}
function editCat(tab,id){
  const list=tab==='word'?D.words:D.sentences;
  const item=list.find(i=>i.id===id);
  dlg(`<h3>修改分类</h3>
  <div class="field"><label>「${esc(item.text.slice(0,30))}${item.text.length>30?'…':''}」应属于：</label>
  <select id="catSel">${allCats().map(c=>`<option ${c===item.cat?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="doEditCat('${tab}','${id}')">保存</button></div>`);
}
function doEditCat(tab,id){
  const list=tab==='word'?D.words:D.sentences;
  const item=list.find(i=>i.id===id);
  item.cat=document.getElementById('catSel').value;
  save(); closeDlg(); render();
}

/* ================= 图片识别（OCR）录入 ================= */
let ocrWorker=null, ocrStatusCb=null, ocrEntries=[];
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=res;
    s.onerror=()=>rej(new Error('识别组件加载失败，请确认已连接网络后重试'));
    document.head.appendChild(s);
  });
}
async function getOcrWorker(){
  if(ocrWorker) return ocrWorker;
  ocrWorker = await Tesseract.createWorker('chi_sim', 1, {
    logger:m=>{
      const el=document.getElementById('ocrMsg');
      if(!el || m.progress===undefined) return;
      const pct=Math.round(m.progress*100);
      if(m.status==='recognizing text'){ el.textContent='识别文字中… '+pct+'%'; ocrStatusCb&&ocrStatusCb(m.progress); }
      else el.textContent='首次使用需加载中文识别包（约15MB，仅一次）… '+(m.status||'')+' '+pct+'%';
    }
  });
  return ocrWorker;
}
/* 清洗OCR文本：去CJK间空格、按块智能合并断行 */
function cleanOcr(text){
  const rawLines = text.split(/\n/).map(s=>s.replace(/[ \t]+/g,m=>' ').trim())
    .map(s=>s.replace(/([\u4e00-\u9fa5，。！？；：、「」『』""''（）])\s+(?=[\u4e00-\u9fa5，。！？；：、「」『』""''（）])/g,'$1'));
  // 按空行分块
  const blocks=[]; let cur=[];
  for(const l of rawLines){
    if(!l){ if(cur.length){blocks.push(cur);cur=[];} continue; }
    if(/[\u4e00-\u9fa5a-zA-Z0-9]/.test(l)) cur.push(l);
  }
  if(cur.length) blocks.push(cur);
  const out=[];
  for(const b of blocks){
    const avg=b.reduce((a,s)=>a+s.length,0)/b.length;
    if(b.length>1 && avg>14){
      // 像被折行的段落 → 合并后按句号切分
      const joined=b.join('');
      joined.split(/(?<=[。！？])/).map(s=>s.trim()).filter(Boolean).forEach(s=>out.push(s));
    } else {
      b.forEach(s=>out.push(s));
    }
  }
  return out.filter(s=>s.length>=1);
}
async function handleImages(fileList){
  const files=[...fileList].filter(f=>f && f.type && f.type.startsWith('image/'));
  if(!files.length) return toast('未检测到图片文件');
  ocrEntries=[];
  const listHtml=files.map((f,i)=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">🖼 ${esc(f.name||('粘贴图片 '+(i+1)))}</span>
    <span id="st${i}" style="color:var(--ink-faint);flex-shrink:0">等待中</span></div>`).join('');
  dlg(`<h3>正在识别 ${files.length} 张图片</h3>${listHtml}
    <div class="prog"><i id="pbar"></i></div>
    <div class="ocr-status" id="ocrMsg">正在准备识别组件…</div>`);
  try{
    await loadTesseract();
    const worker=await getOcrWorker();
    for(let i=0;i<files.length;i++){
      const st=document.getElementById('st'+i); if(st) st.textContent='识别中…';
      ocrStatusCb=p=>{ const el=document.getElementById('pbar'); if(el) el.style.width=Math.round(((i+p)/files.length)*100)+'%'; };
      const {data}=await worker.recognize(files[i]);
      const lines=cleanOcr(data.text||'');
      for(const t of lines){
        ocrEntries.push({text:t, cat:classify(t), target:t.length<=8?'word':'sent'});
      }
      const st2=document.getElementById('st'+i); if(st2) st2.textContent='✓ '+lines.length+' 条';
    }
    const pb=document.getElementById('pbar'); if(pb) pb.style.width='100%';
    showOcrReview();
  }catch(err){
    dlg(`<h3>识别失败</h3><p class="hint" style="font-size:13.5px">${esc(err.message||'发生未知错误')}<br><br>提示：图片识别功能需要联网（首次使用会下载中文识别包）。</p>
    <div class="acts"><button class="btn sm" onclick="closeDlg()">好的</button></div>`);
  }
}
function showOcrReview(){
  if(!ocrEntries.length){
    dlg(`<h3>识别完成</h3><p class="hint" style="font-size:13.5px">未能从图片中识别出文字。<br>建议：使用清晰的截图、文字尽量水平、避免花哨字体或复杂背景。</p>
    <div class="acts"><button class="btn sm" onclick="closeDlg()">好的</button></div>`);
    return;
  }
  let h=`<h3>识别结果确认（共 ${ocrEntries.length} 条）</h3>
  <p class="hint" style="margin-bottom:6px">已自动判断「词汇 / 句段」归属与描写分类。可直接修改文字、调整下拉框，取消勾选则不导入。</p>
  <div style="display:flex;gap:10px;margin-bottom:4px">
    <button class="icon-btn" style="color:var(--sky-deep)" onclick="ocrCheckAll(true)">全选</button>
    <button class="icon-btn" style="color:var(--sky-deep)" onclick="ocrCheckAll(false)">全不选</button>
  </div>`;
  h+=ocrEntries.map((e,i)=>`<div class="ocr-row">
    <input type="checkbox" id="ok${i}" checked style="margin-top:10px;accent-color:var(--sky)">
    <textarea id="tx${i}" rows="1" oninput="autoGrow(this)">${esc(e.text)}</textarea>
    <select id="tg${i}"><option value="word" ${e.target==='word'?'selected':''}>词汇</option><option value="sent" ${e.target==='sent'?'selected':''}>句段</option></select>
    <select id="ct${i}">${allCats().map(c=>`<option ${c===e.cat?'selected':''}>${c}</option>`).join('')}</select>
  </div>`).join('');
  h+=`<div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button>
  <button class="btn sm" onclick="importOcr()">导入所选</button></div>`;
  dlg(h);
  document.getElementById('dialog').classList.add('wide');
  document.querySelectorAll('#dialog textarea').forEach(autoGrow);
}
function ocrCheckAll(v){ ocrEntries.forEach((e,i)=>{ const c=document.getElementById('ok'+i); if(c) c.checked=v; }); }
function importOcr(){
  let nw=0, ns=0;
  ocrEntries.forEach((e,i)=>{
    const ok=document.getElementById('ok'+i); if(!ok||!ok.checked) return;
    const text=document.getElementById('tx'+i).value.trim(); if(!text) return;
    const target=document.getElementById('tg'+i).value;
    const cat=document.getElementById('ct'+i).value;
    (target==='word'?D.words:D.sentences).push({id:uid(),text,cat,ts:Date.now()});
    target==='word'?nw++:ns++;
  });
  save(); closeDlg(); render();
  toast(`已导入 ${nw+ns} 条（词汇 ${nw} · 句段 ${ns}），均已完成分类`);
}
document.getElementById('imgIn').addEventListener('change',e=>{ handleImages(e.target.files); e.target.value=''; });
/* 粘贴截图直接识别（词句积累页） */
document.addEventListener('paste',e=>{
  if(route.page!=='phrase') return;
  const imgs=[...(e.clipboardData&&e.clipboardData.items||[])].filter(it=>it.type&&it.type.startsWith('image/'));
  if(imgs.length){ e.preventDefault(); handleImages(imgs.map(it=>it.getAsFile())); }
});

/* ================= 页面：素材积累 ================= */
function pageMaterial(){
  const q = route.q||'';
  if(q){
    let hits=[];
    D.materials.forEach(m=>m.subs.forEach(s=>s.notes.forEach(n=>{ if(materialMatch(m,s,n,q)) hits.push({m,s,n}); })));
    let h=`<div class="search-bar"><input id="matSearch" type="text" placeholder="搜索素材：分类 / 子分类 / 标题 / 内容…" value="${esc(q)}" oninput="setMaterialSearch(this.value)"><span class="search-ico">🔍</span></div>`;
    h+=`<div class="section-h"><h3>搜索「${esc(q)}」</h3><span class="module-hint">${hits.length} 条结果</span></div>`;
    if(!hits.length) h+=`<div class="empty"><div class="big" style="font-family:var(--kai)">〇</div>没有匹配的素材</div>`;
    else h+=`<div class="archive-list">`+hits.map(({m,s,n})=>`
      <div class="archive-item" onclick="go('material',{sub:'${m.id}/${s.id}'})">
        <span class="ai-ico"></span>
        <span class="ai-title">${esc(n.title||'(无标题)')}</span>
        <span class="ai-path">${esc(m.name)} › ${esc(s.name)}</span>
      </div>`).join('')+`</div>`;
    return h;
  }
  if(route.sub){
    const [mid, sid] = route.sub.split('/');
    const cat = D.materials.find(m=>m.id===mid);
    if(!cat) { route.sub=null; return pageMaterial(); }
    if(sid){
      const sub = cat.subs.find(s=>s.id===sid);
      if(!sub){ route.sub=mid; return pageMaterial(); }
      return matNotes(cat,sub);
    }
    return matSubs(cat);
  }
  let h=`<div class="search-bar"><input id="matSearch" type="text" placeholder="搜索素材：分类 / 子分类 / 标题 / 内容…" value="" oninput="setMaterialSearch(this.value)"><span class="search-ico">🔍</span></div>`;

/* 时间线 */
function addTl(cid){
  const el=document.getElementById('tlIn');
  const raw=el.value.trim(); if(!raw) return;
  const c=D.characters.find(x=>x.id===cid);
  const lines=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  let added=0;
  for(const line of lines){
    const parts=line.split(/[，,]/).map(s=>s.trim()).filter(Boolean);
    if(!parts.length) continue;
    const dateStr=parts[0];
    const p=parseCnDate(dateStr);
    let people='', event='';
    if(parts.length>=3){ people=parts[1]; event=parts.slice(2).join('，'); }
    else if(parts.length===2){ event=parts[1]; }
    else { event=line; }
    c.timeline.push({id:uid(),raw:dateStr,era:p.era,y:p.y,m:p.m,d:p.d,people,event,ts:Date.now()});
    added++;
  }
  save(); closeDlg(); render();
  toast(`已整理 ${added} 条记录并按时间排序`);
}
function openTimelineInput(cid){
  dlg(`<h3>添加时间线</h3>
  <div class="field"><label>按格式录入（每行一条）</label><textarea id="tlIn" rows="5" placeholder="熙和二年三月十四日，祝华予&皇帝，祝华予送了花给皇帝"></textarea></div>
  <div class="hint" style="margin:-2px 0 10px">格式：<b>日期，人物，事件</b>。支持年号纪年，自动按年→月→日排序；可一次粘贴多行批量录入。</div>
  <div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button><button class="btn sm" onclick="addTl('${cid}')">整理收录</button></div>`);

function renderTimeline(c){
  if(!c.timeline.length) return `<div class="empty"><div class="big">🕰️</div>长卷未展，故事待续<br>例：熙和元年二月五日，祝华予&皇后，祝华予送了点心给皇后</div>`;
  const sorted=[...c.timeline].sort((a,b)=> a.era.localeCompare(b.era,'zh') || a.y-b.y || a.m-b.m || a.d-b.d || a.ts-b.ts );
  let h='', lastKey='';
  for(const t of sorted){
    const key = t.y ? `${t.era}${t.y}年${t.m?t.m+'月':''}` : t.era;
    if(key!==lastKey){
      if(lastKey) h+=`</div>`;
      h+=`<div class="tl-group"><div class="tl-era">${esc(key)}</div>`;
      lastKey=key;
    }
    h+=`
      <div class="tl-item" data-swkind="tl" data-swa="${c.id}" data-swb="${t.id}">${selCb('tl', t.id)}<div class="tl-dot"></div>
        <div class="tl-body">
          <div style="display:flex;justify-content:space-between;gap:10px">
            <span class="tl-date">${esc(t.raw)}</span>
            <button class="icon-btn" onclick="delTl('${c.id}','${t.id}')">删除</button>
          </div>
          ${t.people?`<div class="tl-people">👥 ${esc(t.people)}</div>`:''}
          <div class="tl-event">${esc(t.event)}</div>
        </div>
      </div>`;
  }
  if(lastKey) h+=`</div>`;
  return h;
}

let editorState=null;
let pendingBgSetter=null;
function fileToBg(file,max,cb){
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{
    const c=document.createElement('canvas');
    let w=img.width,h=img.height; const scale=Math.min(1, max/Math.max(w,h));
    w=Math.round(w*scale); h=Math.round(h*scale);
    c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.88)); URL.revokeObjectURL(url);
  };
  img.onerror=()=>{ toast('图片读取失败'); URL.revokeObjectURL(url); };
  img.src=url;
}

/* ================= 右滑删除 ================= */
function selKey(kind,a,b){
  if(kind==='matnote') return b.split('|').pop();
  if(kind==='matcat'||kind==='nav'||kind==='char') return a;
  return b;
}
function initSwipe(){
  document.querySelectorAll('[data-swkind]').forEach(el=>{
    if(el._sw) return; el._sw=true;
    const kind=el.getAttribute('data-swkind');
    const a=el.getAttribute('data-swa')||'';
    const b=el.getAttribute('data-swb')||'';
    const wrap=document.createElement('div'); wrap.className='swipe';
    const del=document.createElement('div'); del.className='swipe-del';
    del.innerHTML=`<button class="swipe-del-btn" onclick="event.stopPropagation();swipeDelete('${kind}','${a}','${b}')">删除</button>`;
    const fore=document.createElement('div'); fore.className='swipe-fore';
    el.parentNode.insertBefore(wrap, el);
    fore.appendChild(el);
    wrap.appendChild(del); wrap.appendChild(fore);
    let sx=0,sy=0,dx=0,dy=0,drag=false,open=false,sw=false,long=false,timer=null; const delW=76, longMs=500;
    function clearTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
    fore.addEventListener('pointerdown',e=>{
      if(e.target.closest('button')||e.target.closest('select')||e.target.closest('input')||e.target.closest('textarea')) return;
      sx=e.clientX; sy=e.clientY; dx=0; dy=0; drag=false; sw=false; long=false; clearTimer();
      timer=setTimeout(()=>{ if(!drag){ long=true; _selLock=true; setTimeout(()=>_selLock=false,150); startSelect(kind,a,b); } }, longMs);
      try{fore.setPointerCapture(e.pointerId);}catch(_){}
    });
    fore.addEventListener('pointermove',e=>{
      if(sx===0&&sy===0) return;
      dx=e.clientX-sx; dy=e.clientY-sy;
      if(!drag && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){ drag=true; clearTimer(); }
      else if(!drag && Math.abs(dy)>12){ clearTimer(); }
      if(drag){ clearTimer(); let t=open?(delW-dx):(-dx); if(t<0)t=0; if(t>delW)t=delW; fore.style.transition='none'; fore.style.transform='translateX(-'+t+'px)'; }
    });
    fore.addEventListener('pointerup',e=>{
      clearTimer();
      if(drag){ let t=open?(delW-dx):(-dx); if(t<0)t=0; if(t>delW)t=delW; if((!open&&dx<-delW*0.35)||(open&&dx>delW*0.35)) open=!open; fore.style.transition='transform .2s'; fore.style.transform=open?('translateX(-'+delW+'px)'):'translateX(0)'; sw=true; setTimeout(()=>sw=false,60); }
      else if(!long && !_selLock && SEL && SEL.kind===kind){ toggleSel(selKey(kind,a,b)); sw=true; setTimeout(()=>sw=false,60); }
      else if(open){ open=false; fore.style.transition='transform .2s'; fore.style.transform='translateX(0)'; sw=true; setTimeout(()=>sw=false,60); }
      sx=0; sy=0;
    });
    fore.addEventListener('click',e=>{
      if(SEL && SEL.kind===kind && !e.target.closest('.sel-cb')){ e.stopPropagation(); e.preventDefault(); }
      else if(sw){ e.stopPropagation(); e.preventDefault(); }
    }, true);
  });
}
function swipeDelete(kind,a,b){
  if(kind==='phrase') delPhrase(a,b);
  else if(kind==='matcat') delMatCat(a);
  else if(kind==='matsub') delMatSub(a,b);
  else if(kind==='matnote'){ const p=b.split('|'); delMatNoteAndClose(a,p[0],p[1]); }
  else if(kind==='archive') delArchiveItemAndClose(a,b);
  else if(kind==='nb') nbSwipeDelete(a);
  else if(kind==='nav') delNav(a);
  else if(kind==='char') delChar(a);
  else if(kind==='tl') delTl(a,b);
  else if(kind==='rel') delRel(a,b);
}
function nbSwipeDelete(id){
  const book=NB; if(!book) return;
  const items=book.items(); const it=items.find(x=>x.id===id);
  confirmDel('删除这条内容？若是文件夹，其中内容会一并删除。',()=>{
    if(it && it.type==='folder'){ book.set(items.filter(x=>x.id!==id && x.parentId!==id)); }
    else { book.set(items.filter(x=>x.id!==id)); }
    book.save(); render();
  });
}
/* ================= 长按多选批量操作 ================= */
function selCb(kind,id){ return SEL&&SEL.kind===kind ? `<input type="checkbox" class="sel-cb" ${SEL.ids.has(id)?'checked':''} onclick="event.stopPropagation();toggleSel('${id}')">` : ''; }
function toggleSel(id){ if(!SEL) return; if(SEL.ids.has(id)) SEL.ids.delete(id); else SEL.ids.add(id); render(); updateSelBar(); }
function selectAll(){ if(!SEL) return; SEL.items.forEach(it=>SEL.ids.add(it.id)); render(); updateSelBar(); }
function clearSel(){ SEL=null; render(); }
function updateSelBar(){
  const bar=document.getElementById('selBar'); if(!bar) return;
  if(!SEL){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const count=document.getElementById('selCount'); if(count) count.textContent=SEL.ids.size;
  const moveBtn=document.getElementById('selMoveBtn'); if(moveBtn) moveBtn.style.display=SEL.moveFn?'':'none';
}
function startSelect(kind,a,b){
  const key=selKey(kind,a,b); let ctx={},items=[],deleteFn=null,moveFn=null;
  if(kind==='archive'){
    const cid=a, parentId=route.filter||null; const c=D.characters.find(x=>x.id===cid);
    items=(c.archive.items||[]).filter(x=>x.parentId===parentId);
    ctx={cid,parentId};
    deleteFn=(ids)=>{ c.archive.items=c.archive.items.filter(x=>!ids.has(x.id)&&!ids.has(x.parentId)); };
    moveFn=(ids,targetId)=>{ c.archive.items.forEach(x=>{ if(ids.has(x.id)) x.parentId=targetId; }); };
  } else if(kind==='nb'){
    const book=NB; if(!book) return;
    const parentId=route.filter||null; items=book.items().filter(x=>x.parentId===parentId); ctx={parentId};
    deleteFn=(ids)=>{ const arr=book.items().filter(x=>!ids.has(x.id)&&!ids.has(x.parentId)); book.set(arr); };
    moveFn=(ids,targetId)=>{ const arr=book.items(); arr.forEach(x=>{ if(ids.has(x.id)) x.parentId=targetId; }); book.set(arr); };
  } else if(kind==='phrase'){
    const tab=a, cat=route.filter||null; const list=(tab==='word'?D.words:D.sentences); items=cat?list.filter(i=>i.cat===cat):list.slice(); ctx={tab,cat};
    deleteFn=(ids)=>{ if(tab==='word') D.words=D.words.filter(x=>!ids.has(x.id)); else D.sentences=D.sentences.filter(x=>!ids.has(x.id)); };
  } else if(kind==='matnote'){
    const [mid,sid]=[a,b.split('|')[0]]; const cat=D.materials.find(m=>m.id===mid); const sub=cat.subs.find(s=>s.id===sid); items=sub.notes.slice(); ctx={mid,sid};
    deleteFn=(ids)=>{ sub.notes=sub.notes.filter(x=>!ids.has(x.id)); };
  } else if(kind==='matcat'){
    items=D.materials.slice();
    deleteFn=(ids)=>{ D.materials=D.materials.filter(x=>!ids.has(x.id)); };
  } else if(kind==='matsub'){
    const mid=a; const cat=D.materials.find(m=>m.id===mid); items=cat.subs.slice(); ctx={mid};
    deleteFn=(ids)=>{ cat.subs=cat.subs.filter(x=>!ids.has(x.id)); };
  } else if(kind==='char'){
    items=D.characters.slice();
    deleteFn=(ids)=>{ D.characters=D.characters.filter(x=>!ids.has(x.id)); };
  } else if(kind==='nav'){
    items=D.customNavs.slice();
    deleteFn=(ids)=>{ D.customNavs=D.customNavs.filter(x=>!ids.has(x.id)); };
  } else if(kind==='tl'){
    const cid=a; const c=D.characters.find(x=>x.id===cid); items=c.timeline.slice(); ctx={cid};
    deleteFn=(ids)=>{ c.timeline=c.timeline.filter(x=>!ids.has(x.id)); };
  } else if(kind==='rel'){
    const cid=a; const c=D.characters.find(x=>x.id===cid); items=c.relations.slice(); ctx={cid};
    deleteFn=(ids)=>{ c.relations=c.relations.filter(x=>!ids.has(x.id)); };
  }
  SEL={kind,ctx,ids:new Set([key]),items,deleteFn,moveFn};
  render(); updateSelBar();
}
function batchDelete(){
  if(!SEL || !SEL.ids.size) return toast('请先选择要删除的项');
  confirmDel(`确定删除选中的 ${SEL.ids.size} 项？`,()=>{ SEL.deleteFn(SEL.ids); SEL=null; save(); render(); toast('已批量删除'); });
}
function batchMove(){
  if(!SEL || !SEL.moveFn || !SEL.ids.size) return toast('请先选择');
  if(SEL.kind==='archive') showArchiveMoveTargets(SEL.ctx.cid, SEL.ids);
  else if(SEL.kind==='nb') showNbMoveTargets(SEL.ids);
}
function showArchiveMoveTargets(cid, ids){
  const c=D.characters.find(x=>x.id===cid);
  const folders=c.archive.items.filter(x=>x.type==='folder' && !ids.has(x.id));
  if(!folders.length) return toast('没有可移入的文件夹');
  const btns=folders.map(f=>`<button class="btn" onclick="doBatchMove('${f.id}')">${esc(f.title)}</button>`).join('');
  dlg(`<h3>批量移入文件夹</h3><div style="display:flex;flex-direction:column;gap:10px">${btns}</div><div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button></div>`);
}
function showNbMoveTargets(ids){
  const book=NB; if(!book) return;
  const items=book.items();
  const folders=items.filter(x=>x.type==='folder' && !ids.has(x.id));
  if(!folders.length) return toast('没有可移入的文件夹');
  const btns=folders.map(f=>`<button class="btn" onclick="doBatchMove('${f.id}')">${esc(f.title)}</button>`).join('');
  dlg(`<h3>批量移入文件夹</h3><div style="display:flex;flex-direction:column;gap:10px">${btns}</div><div class="acts"><button class="btn sm ghost" onclick="closeDlg()">取消</button></div>`);
}
function doBatchMove(targetId){
  if(!SEL || !SEL.moveFn) return;
  SEL.moveFn(SEL.ids, targetId); SEL=null; save(); closeDlg(); render(); toast('已批量移动');
}

/* ================= 导出：图片 / 文件 ================= */
function downloadUrl(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function downloadText(text,name){ const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); downloadUrl(url,name); setTimeout(()=>URL.revokeObjectURL(url),1500); }
function exportImage(title,body,style){
  style=style||{}; const family=style.fontFamily||''; const size=Number(style.fontSize||16); const color=style.color||'#2f3e4d'; const weight=style.fontWeight||'normal';
  const pad=44, maxW=720, cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  const fontStr=weight+' '+size+'px '+(family||'serif');
  ctx.font=fontStr;
  const lines=[]; (body||' ').split('\n').forEach(p=>{ let cur=''; for(const ch of p){ const test=cur+ch; if(ctx.measureText(test).width>maxW-pad*2 && cur){ lines.push(cur); cur=ch; } else cur=test; } lines.push(cur); });
  const lineH=Math.round(size*1.95); const titleH=title?Math.round(size*1.7)+16:0; const totalH=pad*2+titleH+lines.length*lineH+24;
  cv.width=maxW; cv.height=totalH;
  ctx.fillStyle='#f5f9fb'; ctx.fillRect(0,0,maxW,totalH);
  ctx.fillStyle=color; ctx.textBaseline='top'; let y=pad;
  if(title){ ctx.font='bold '+Math.round(size*1.5)+'px '+(family||'serif'); ctx.fillText(title,pad,y); y+=titleH; ctx.font=fontStr; }
  for(const ln of lines){ ctx.fillText(ln,pad,y); y+=lineH; }
  downloadUrl(cv.toDataURL('image/png'), (title||'无明')+'.png');
}
function exportCurrentImage(){
  const title=document.getElementById('editorTitle')?document.getElementById('editorTitle').value.trim():'';
  const body=document.getElementById('editorBody').value;
  const style={ fontFamily:document.getElementById('editorFont').value, fontSize:Number(document.getElementById('editorSize').value), color:document.getElementById('editorColor').value, fontWeight:document.getElementById('editorWeight').value };
  exportImage(title,body,style); toast('已导出图片');
}
function exportCurrentFile(){
  const title=document.getElementById('editorTitle')?document.getElementById('editorTitle').value.trim():'';
  const body=document.getElementById('editorBody').value;
  downloadText((title?title+'\n\n':'')+body, (title||'无明')+'.txt'); toast('已导出文件');
}
/* 回车快捷收录（词句页） */
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey && e.target.id==='phIn'){ e.preventDefault(); addPhrase(); }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && e.target.id==='tlIn'){ e.preventDefault(); const btn=document.querySelector('#dialog .btn:not(.ghost)'); btn&&btn.click(); }
});
applyTheme(D.settings.theme||'qingshan');
loadCustomFonts();
renderBrand();
updateOnline();
render();
</script>
<div id="selBar">
  <div class="sel-info">已选 <span id="selCount">0</span> 项</div>
  <div class="sel-actions">
    <button class="btn sm ghost" onclick="selectAll()">全选</button>
    <button class="btn sm ghost" onclick="batchMove()" id="selMoveBtn">移入文件夹</button>
    <button class="btn sm" style="color:var(--danger)" onclick="batchDelete()">批量删除</button>
    <button class="btn sm ghost" onclick="clearSel()">取消</button>
  </div>
</div>
